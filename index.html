<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="description" content="Kora turns WhatsApp and email complaints into classified, auditable support actions with visible human control." />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const savedTheme = localStorage.getItem("kora_theme");
        document.documentElement.dataset.theme = savedTheme === "dark" || savedTheme === "light"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="icon" href="/kora-mark.svg" type="image/svg+xml" />
    <title>Kora | AI-assisted support operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
