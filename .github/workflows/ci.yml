name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the production Docker image.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint backend
        run: ruff check backend
      - name: Run backend tests
        run: PYTHONPATH=backend pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npx eslint src
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Build the application
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t kora:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name kora -p 8000:8000 -e KORA_DATABASE_PATH=/data/kora.db kora:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          docker logs kora
          exit 1
